<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">CRUCIBLE — Frontier AI Cyber TEVV</title>
  <desc id="desc">An AI system passes through a controlled evaluation chamber and emerges as structured evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2035"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#25d0a5"/><stop offset="1" stop-color="#68a5ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <path d="M80 78H1520M80 560H1520" stroke="#19364f" stroke-width="2"/>
  <text x="96" y="170" fill="#e7f2ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="84" font-weight="700" letter-spacing="8">CRUCIBLE</text>
  <text x="100" y="222" fill="#72e6c4" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24" letter-spacing="5">FRONTIER AI CYBER TEVV</text>
  <g transform="translate(105 340)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">
    <rect width="180" height="84" rx="12" fill="#10283d" stroke="#38607c"/><text x="90" y="50" fill="#d8eafd" text-anchor="middle">AI SYSTEM</text>
    <path d="M185 42H335" stroke="url(#beam)" stroke-width="4"/>
    <rect x="340" y="-30" width="430" height="144" rx="16" fill="#0d2636" stroke="#25d0a5" stroke-width="3" filter="url(#glow)"/>
    <text x="555" y="17" fill="#72e6c4" text-anchor="middle" letter-spacing="3">CONTROLLED RANGE</text>
    <text x="555" y="55" fill="#aac2d8" text-anchor="middle">TASK • AGENT • TOOLS • BUDGET</text>
    <text x="555" y="86" fill="#aac2d8" text-anchor="middle">ISOLATE • OBSERVE • SCORE</text>
    <path d="M775 42H925" stroke="url(#beam)" stroke-width="4"/>
    <rect x="930" width="380" height="84" rx="12" fill="#10283d" stroke="#68a5ff"/>
    <text x="1120" y="34" fill="#d8eafd" text-anchor="middle">DEFENSIBLE EVIDENCE</text>
    <text x="1120" y="61" fill="#85a5c0" text-anchor="middle">HASHED • TRACEABLE • REPRODUCIBLE</text>
  </g>
  <text x="100" y="525" fill="#c6d9ea" font-family="ui-sans-serif, system-ui" font-size="25">Measure capability before capability becomes consequence.</text>
  <text x="1504" y="525" fill="#4e7999" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" text-anchor="end">v0.1.0</text>
</svg>
